<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>準備畫面示範 (Prep Overlay Demo)</title>
  <link rel="stylesheet" href="./prep_style.css" />
</head>
<body>
  <!-- The overlay itself is created dynamically by prep_script.js -->

  <script src="./prep_script.js"></script>
  <script>
    // Demo: show the overlay automatically when this page loads.
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof showPrepOverlay === "function") {
        // Choice 1: endless marquee (default)
        showPrepOverlay("Melon", { effect: "marquee", direction: "left" });

        // Choice 2: simpler pulse loader
        // showPrepOverlay("Melon", { effect: "pulse" });
      }

      // Hide it after 3 seconds just for demonstration.
      setTimeout(function () {
        if (typeof hidePrepOverlay === "function") {
          hidePrepOverlay();
        }
      }, 3000);
    });
  </script>
</body>
</html>
