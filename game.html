<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>士多啤梨熊數線尋寶 - 2.5D 叢林背景</title>
  <link rel="stylesheet" href="./game_style.css" />
  <!-- 使用 Tailwind CDN 以支援原本的樣式類別 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- 2.5D Jungle Canvas Background -->
  <canvas id="gameCanvas"></canvas>

  <!-- Black steel bar and claw machine clamp -->
  <div id="clawBar"></div>
  <canvas id="clawCanvas" width="600" height="600"></canvas>

  <!-- Hidden SFX audio elements (trigger from game_script.js) -->
    <audio id="sfxPlaceCorrect" src="" preload="auto" style="display: none;"></audio>
  <audio id="sfxPlaceWrong" src="" preload="auto" style="display: none;"></audio>
  <audio id="sfxCorrectHappy" src="" preload="auto" style="display: none;"></audio>


  
    <!-- Helper Bear Image -->
  <img
    id="pineappleBearImage"
    src="./stb_helper_concentrated.png"
    alt="士多啤梨熊圖片"
    style="position: fixed; top: 60%; left: 1%; transform: scale(0.25); transform-origin: top left; pointer-events: none;"
  />


  <!--<img
    id="yellowBubbleImage"
    src="./yellow_bubble.png"
    alt="黃色對話泡泡"
    style="position: fixed; pointer-events: none; display: none; z-index: 10; transform: translateY(-90%) translateX(-2.5%) scale(0.4); transform-origin: bottom left;"
  />
  <div id="yellowBubbleText" aria-live="polite" aria-atomic="true"></div> -->
  











































    <!-- Top-left slide-out menu arrow -->
  <button
    id="menuArrow"
    class="menu-arrow strawberry-box"
    onclick="returnToMenu()"
    type="button"
  >
    <span class="menu-arrow-tip">
      ↩
    </span>
    <span class="menu-arrow-label">
      🏠 返回菜單
    </span>
  </button>

  <!-- Fixed orange circular home button -->
  <button
    id="homeCircleButton"
    class="home-circle-button"
    onclick="returnToMenu()"
    type="button"
  >
    🏠
  </button>

    <div id="gameShell" class="game-shell max-w-3xl mx-auto">
        <!-- 頂部標題列 -->
    <header class="game-header">
      <img
        id="gameHeaderImage"
        src="./orange_game_title.png"
        alt="士多啤梨熊數線尋寶遊戲標題"
      />
    </header>


    <!-- 主菜單容器：新版流程中不顯示任何內容，僅作結構及後備使用 -->
    <div id="mainMenu" class="hidden"></div>

        <!-- 遊戲區：登入及主選單後直接顯示 -->
    <div id="gameArea">

        <!-- 結果顯示 -->

      <div
        id="result"
        class="text-xl md:text-3xl custom-font-bold text-center mb-6"
      ></div>


      <!-- 寶箱 -->
      <div id="treasure" class="hidden mb-6">
        <div id="chest" class="w-40 h-28 mx-auto relative chest">
          <div
            class="chest-lid w-40 h-12 bg-gradient-to-b from-yellow-300 to-yellow-400 rounded-t-3xl border-4 border-orange-400 absolute top-0 flex items-center justify-center"
          >
            <div
              class="w-8 h-6 bg-yellow-600 rounded-full border-2 border-yellow-700"
            ></div>
          </div>
          <div
            class="w-40 h-16 bg-gradient-to-b from-orange-300 to-orange-400 rounded-b-3xl border-4 border-orange-500 absolute bottom-0 flex items-center justify-center"
          >
            <div class="text-2xl" id="treasureContent">🎁</div>
          </div>
        </div>
        <p id="outfitName" class="text-lg custom-font-bold text-amber-700 mt-3"></p>
      </div>

      <div
        class="flex flex-col md:flex-row justify-center items-center gap-4 md:gap-6"
      >
        <!-- 對話框 -->
        <div
          class="speech-bubble rounded-3xl p-4 max-w-xs order-2 md:order-1"
        >
          <p id="speech" class="text-lg md:text-xl">
            
          </p>
        </div>
    </div>
  </div>

  <!-- 勝利模態 -->
  <div id="victoryModal" class="modal-overlay hidden">
    <div class="modal-content">
      <p class="text-4xl md:text-5xl custom-font-bold text-green-600 mb-6">
        🎉 做得好！
      </p>
      <button
        onclick="closeVictoryModal()"
        class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white custom-font-bold rounded-full text-xl"
      >
        繼續玩 🎮
      </button>
    </div>
  </div>

  <div
    id="bottomModeArrowStrip"
    class="flex items-center justify-center"
    aria-hidden="true"
    style="
      position: fixed;
      align-items: center;
      filter: drop-shadow(4px 4px 0 rgba(255,255,255,0.5));
      gap: 0.5vw;
    "
  >
    <!-- Treat the number line as a single SVG element between two simple labels -->
    <span
      class="text-3xl"
      style="color:white; display: flex; align-items: center; line-height: 1; text-shadow: 2px 2px 0 rgba(255,255,255,0.6);"
    >
      小
    </span>

    <svg
      id="numberLineSVG"
      viewBox="0 0 5000 200"
      class="w-full h-auto"
      style="display: block;"
    >
            <!-- Depth layer: arrow spans almost the full SVG width for a longer visual axis -->
      <line
        id="mainAxisBack"
        x1="50"
        y1="84"
        x2="4950"
        y2="84"
        stroke="rgba(150,150,150,0.55)"
        stroke-width="24"
      />
      <!-- Back arrowheads (manual polygons, no markers) -->
      <!-- <polygon
        id="mainAxisBackLeftArrow"
        points="10 84, 110 4, 110 164"
        fill="rgba(150,150,150,0.55)"
      />
      <polygon
        id="mainAxisBackRightArrow"
        points="4990 84, 4890 4, 4890 164"
        fill="rgba(150,150,150,0.55)"
      /> -->

      <!-- Main Horizontal Line: matching extended axis in the foreground layer -->
      <line
        id="mainAxis"
        x1="50"
        y1="80"
        x2="4950"
        y2="80"
        stroke="white"
        stroke-width="18"
      />
      <!-- Foreground arrowheads (manual polygons, no markers) -->
      <!-- <polygon
        id="mainAxisLeftArrow"
        points="10 80, 50 72, 50 88"
        fill="white"
      />
      <polygon
        id="mainAxisRightArrow"
        points="4990 80, 4950 72, 4950 88"
        fill="white"
      />!-->

      <!-- Dynamic Tick Marks and Labels will be injected here by game_script.js -->
      <g id="ticksGroupBack"></g>
      <g id="labelsGroupBack"></g>
      <g id="ticksGroup"></g>
      <g id="labelsGroup"></g>

    </svg>

    <span
      class="text-6xl"
      style="color:white; display: flex; align-items: center; line-height: 1; text-shadow: 3px 3px 0 rgba(255,255,255,0.6);"
    >
      大
    </span>
  </div>


  

  
  

    <script src="./zdog.js"></script>
  <script src="./game_script.js"></script>
  <script>

    // Simple UI to control the claw position from the top-right corner
    (function () {
      const panel = document.createElement('div');
      panel.id = 'clawControlPanel';
      panel.style.position = 'fixed';
      panel.style.top = '8vh';
      panel.style.right = '2vw';
      panel.style.zIndex = '1600';
      panel.style.display = 'flex';
      panel.style.flexDirection = 'row';
      panel.style.alignItems = 'center';
      panel.style.gap = '0.5rem';
      panel.style.padding = '0.5rem 0.75rem';
      panel.style.background = 'rgba(15,23,42,0.85)';
      panel.style.borderRadius = '999px';
      panel.style.boxShadow = '0 10px 20px rgba(0,0,0,0.7)';

      const input = document.createElement('input');
      input.type = 'number';
      input.id = 'clawControlInput';
      input.min = '0';
      input.step = '1';
      input.style.width = '4rem';
      input.style.padding = '0.25rem 0.5rem';
      input.style.borderRadius = '999px';
      input.style.border = '1px solid rgba(148,163,184,0.9)';
      input.style.fontSize = '0.875rem';

      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Move Claw';
      button.style.padding = '0.35rem 0.85rem';
      button.style.borderRadius = '999px';
      button.style.border = 'none';
      button.style.cursor = 'pointer';
      button.style.fontSize = '0.875rem';
      button.style.fontWeight = '600';
      button.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
      button.style.color = '#fff';
      button.style.boxShadow = '0 6px 0 rgba(15,23,42,0.8)';

      button.addEventListener('click', function () {
        if (typeof window.controlClawPosition !== 'function') return;
        const raw = input.value;
        const value = raw === '' ? 0 : Number(raw);
        if (!Number.isFinite(value)) return;
        window.controlClawPosition(value);
      });

      panel.appendChild(input);
      panel.appendChild(button);
      document.body.appendChild(panel);
    })();



    (function () {
      function playAudioById(id) {
        const el = document.getElementById(id);
        if (!el) return;
        try {
          el.currentTime = 0;
          el.play();
        } catch (_) {}
      }

      window.playPlaceCorrectSfx = function () {
        playAudioById('sfxPlaceCorrect');
      };

      window.playPlaceWrongSfx = function () {
        playAudioById('sfxPlaceWrong');
      };

      window.playCorrectHappySfx = function () {
        playAudioById('sfxCorrectHappy');
      };
    })();

    (function () {
      const bear = document.getElementById('pineappleBearImage');
      const bubble = document.getElementById('yellowBubbleImage');
      const bubbleText = document.getElementById('yellowBubbleText');

      function positionBubble() {
        if (!bear || !bubble) return;
        const rect = bear.getBoundingClientRect();
        bubble.style.left = `${rect.right}px`;
        bubble.style.top = `${rect.top}px`;
        bubble.style.display = 'block';

        if (bubbleText) {
          const bubbleRect = bubble.getBoundingClientRect();
          bubbleText.style.left = `${bubbleRect.left + bubbleRect.width / 2}px`;
          bubbleText.style.top = `${bubbleRect.top + bubbleRect.height / 2}px`;
          bubbleText.style.display = 'flex';
        }
      }

      window.addEventListener('load', positionBubble);
      window.addEventListener('resize', positionBubble);
    })();
  </script>
</body>
</html>
