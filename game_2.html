<script>
  // Web Audio–based sound manager
  (function () {
    const AudioContext = window.AudioContext || window.webkitAudioContext;

    // If Web Audio is not supported, expose no‑op functions so game_script_2.js doesn’t break
    if (!AudioContext) {
      const noop = function () {};
      window.playPlaceCorrectSfx = noop;
      window.playPlaceWrongSfx = noop;
      window.playCorrectHappySfx = noop;
      window.playMiddleLevelSuccessSfx = noop;
      window.playVoiceRoboticInput = noop;
      window.playVoiceRoboticError = noop;
      window.playVoiceRoboticFail = noop;
      window.playClawAttemptFail = noop;
      window.playClawAttemptSuccess = noop;
      window.playTotalVictory = noop;
      window.playRunningGearSegment = noop;
      window.playPanelButtonClick = noop;
      window.playVictorySuccessVoice = noop;
      window.stopVictorySuccessVoice = noop;
      console.warn('Web Audio API not supported; audio disabled.');
      return;
    }

        const audioContext = new AudioContext();
    const buffers = {};
    const loadingPromises = {};

    // Map logical IDs to audio files (only ones that had non‑empty src)
    const audioFiles = {
      // These three had empty src in your HTML; leave them unmapped (no sound)
      sfxPlaceCorrect: null,
      sfxPlaceWrong: null,
      sfxCorrectHappy: null,

      sfxMiddleLevelSuccess: './middle_level_success.mp3',
      voiceRoboticInput: './voice_human_input.mp3',
      voiceRoboticError: './voice_human_overflow.mp3',
      voiceHumanFail: './voice_human_fail.mp3',
      voiceHumanHopefulFail: './voice_human_hopeful_fail.mp3',
      clawAttemptFail: './claw_attempt_fail.mp3',
      clawAttemptSuccess: './claw_attempt_success.mp3',
      totalVictory: './total_victory.mp3',
      runningGear: './running_gear.mp3',
      panelButton: './panel_button.mp3',
      voiceVictorySuccess01: './voice_human_success_01.mp3',
      voiceVictorySuccess02: './voice_human_success_02.mp3',
      voiceVictorySuccess03: './voice_human_success_03.mp3',
      voiceVictorySuccess04: './voice_human_success_04.mp3',
      voiceVictorySuccess05: './voice_human_success_05.mp3'
    };

    // Shared URL sanitiser for audio file requests.
    // Strips control characters (including null bytes) and validates
    // protocol before passing URLs into fetch/decodeAudioData.
    const CONTROL_CHARS_REGEX = /[\u0000-\u001F\u007F]/g;

    function sanitizeMediaUrl(raw) {
      if (typeof raw !== 'string') {
        console.warn('[Audio] non-string URL', raw);
        return null;
      }

      const cleaned = raw.replace(CONTROL_CHARS_REGEX, '').trim();
      if (!cleaned) {
        console.warn('[Audio] cleaned URL is empty', { raw });
        return null;
      }

      let urlObj;
      try {
        urlObj = new URL(cleaned, window.location.origin);
      } catch (e) {
        console.warn('[Audio] invalid URL format', { cleaned, error: e });
        return null;
      }

      const protocol = urlObj.protocol;
      if (
        protocol !== 'http:' &&
        protocol !== 'https:' &&
        protocol !== 'blob:' &&
        protocol !== 'data:'
      ) {
        console.warn('[Audio] disallowed protocol', { url: urlObj.toString() });
        return null;
      }

      return urlObj.toString();
    }

    // Also expose a global sanitiser for other scripts (e.g. menu_2.html).
    if (!window.sanitizeMediaUrl) {
      window.sanitizeMediaUrl = sanitizeMediaUrl;
    }


    // Unlock audio context on first user interaction (required by many browsers)
    function unlockAudioContextOnFirstInteraction() {
      const unlock = function () {
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(function () {});
        }
        document.removeEventListener('click', unlock);
        document.removeEventListener('keydown', unlock);
        document.removeEventListener('touchstart', unlock);
      };
      document.addEventListener('click', unlock);
      document.addEventListener('keydown', unlock);
      document.addEventListener('touchstart', unlock);
    }

    unlockAudioContextOnFirstInteraction();

        function loadBuffer(id) {
      if (buffers[id]) {
        return Promise.resolve(buffers[id]);
      }
      const rawUrl = audioFiles[id];
      if (!rawUrl) {
        return Promise.reject(new Error('No audio file configured for id: ' + id));
      }

      const url = sanitizeMediaUrl(rawUrl);
      if (!url) {
        return Promise.reject(new Error('Invalid audio URL for id: ' + id));
      }

            if (!loadingPromises[id]) {
        loadingPromises[id] = fetch(url, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('HTTP ' + response.status + ' while loading ' + id);
            }
            const contentType = response.headers.get('Content-Type') || '';
            if (!/audio|octet-stream/i.test(contentType)) {
              throw new Error('Unexpected content-type "' + contentType + '" for ' + id);
            }
            return response.arrayBuffer();
          })
          .then(function (data) {
            // Use callback form of decodeAudioData to avoid subtle promise/GC races
            return new Promise(function (resolve, reject) {
              audioContext.decodeAudioData(
                data,
                function (buffer) {
                  resolve(buffer);
                },
                function (err) {
                  reject(err || new Error('decodeAudioData failed for ' + id));
                }
              );
            });
          })
          .then(function (buffer) {
            buffers[id] = buffer;
            return buffer;
          })
          .catch(function (err) {
            console.error('[Audio] Failed to load', id, 'from', url, err);
            // Cache the failure so we don't keep retrying this id.
            buffers[id] = null;
            return null;
          });
      }

      return loadingPromises[id];
    }



        function playBuffer(id, options) {
      options = options || {};
      loadBuffer(id)
        .then(function (buffer) {
          if (!buffer) {
            // This id failed to load or decode; skip playback.
            return null;
          }

          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);

          const offset = options.offset || 0;
          const duration = options.duration;

          try {
            if (typeof duration === 'number') {
              source.start(0, offset, duration);
            } else {
              source.start(0, offset);
            }
          } catch (e) {
            console.error('[Audio] bufferSource.start() failed for', id, e);
            return null;
          }

          if (typeof options.onended === 'function') {
            source.onended = options.onended;
          }

          return source;
        })
        .catch(function (err) {
          // Fail silently to avoid breaking gameplay, but log once for diagnostics.
          console.error('[Audio] playBuffer error for', id, err);
        });
    }


    // Preload all configured audio buffers to minimise latency
    Object.keys(audioFiles).forEach(function (id) {
      if (audioFiles[id]) {
        loadBuffer(id).catch(function () {});
      }
    });

    // === Public API (same function names as before) ===

    window.playPlaceCorrectSfx = function () {
      playBuffer('sfxPlaceCorrect');
    };

    window.playPlaceWrongSfx = function () {
      playBuffer('sfxPlaceWrong');
    };

    window.playCorrectHappySfx = function () {
      playBuffer('sfxCorrectHappy');
    };

    window.playMiddleLevelSuccessSfx = function () {
      playBuffer('sfxMiddleLevelSuccess');
    };

    window.playVoiceRoboticInput = function () {
      playBuffer('voiceRoboticInput');
    };

    window.playVoiceRoboticError = function () {
      playBuffer('voiceRoboticError');
    };

    window.playVoiceRoboticFail = function (diff) {
      var id = Math.abs(diff) > 3 ? 'voiceHumanHopefulFail' : 'voiceHumanFail';
      playBuffer(id);
    };

    window.playClawAttemptFail = function () {
      playBuffer('clawAttemptFail');
    };

    window.playClawAttemptSuccess = function () {
      playBuffer('clawAttemptSuccess');
    };

    window.playTotalVictory = function () {
      playBuffer('totalVictory');
    };

    // Play only the last ~3 seconds segment (starting at 6s) of running_gear.mp3
    window.playRunningGearSegment = function () {
      playBuffer('runningGear', { offset: 6 });
    };

    window.playPanelButtonClick = function () {
      playBuffer('panelButton');
    };

    // Victory success voices (random variant) + ability to stop them
    var victoryIds = [
      'voiceVictorySuccess01',
      'voiceVictorySuccess02',
      'voiceVictorySuccess03',
      'voiceVictorySuccess04',
      'voiceVictorySuccess05'
    ];

    var activeVictorySources = [];

    window.playVictorySuccessVoice = function () {
      var index = Math.floor(Math.random() * victoryIds.length);
      var chosenId = victoryIds[index];

      loadBuffer(chosenId)
        .then(function (buffer) {
          var source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start(0);

          activeVictorySources.push(source);
          source.onended = function () {
            activeVictorySources = activeVictorySources.filter(function (s) {
              return s !== source;
            });
          };
        })
        .catch(function () {});
    };

    window.stopVictorySuccessVoice = function () {
      activeVictorySources.forEach(function (source) {
        try {
          source.stop();
        } catch (e) {}
      });
      activeVictorySources = [];
    };
  })();




  (function () {
    const bear = document.getElementById('pineappleBearImage');
    const bubble = document.getElementById('yellowBubbleImage');
    const bubbleText = document.getElementById('yellowBubbleText');

    function positionBubble() {
      if (!bear || !bubble) return;
      const rect = bear.getBoundingClientRect();
      bubble.style.left = `${rect.right}px`;
      bubble.style.top = `${rect.top}px`;
      bubble.style.display = 'block';

      if (bubbleText) {
        const bubbleRect = bubble.getBoundingClientRect();
        bubbleText.style.left = `${bubbleRect.left + bubbleRect.width / 2}px`;
        bubbleText.style.top = `${bubbleRect.top + bubbleRect.height / 2}px`;
        bubbleText.style.display = 'flex';
      }
    }

    window.addEventListener('load', positionBubble);
    window.addEventListener('resize', positionBubble);
  })();
  </script>
